<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 AI 개념 탐험가 & 학습 노트</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 900px;
            background: var(--card-color);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1, h2 { text-align: center; color: var(--primary-color); }
        .auth-box, .app-box { display: none; }
        .active { display: block; }
        
        /* 입력 폼 및 버튼 스타일 */
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #357abd; }
        .btn-secondary { background-color: #6c757d; margin-left: 5px; }
        .btn-secondary:hover { background-color: #5a6268; }

        /* 메인 레이아웃 */
        .main-content {
            display: grid;
            grid-template-columns: 2sfr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }
        .search-section, .history-section {
            background: #f9fbfd;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e1e8ed;
        }
        .result-area {
            margin-top: 15px;
            padding: 15px;
            background: #fff;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            min-height: 100px;
            white-space: pre-wrap;
        }
        .history-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-list li {
            padding: 10px;
            background: #fff;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #eee;
            cursor: pointer;
        }
        .history-list li:hover { background: #edf4fc; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-box" class="auth-box active">
        <h1>🔑 AI 탐험가 로그인</h1>
        <input type="email" id="auth-email" placeholder="이메일 주소 입력">
        <input type="password" id="auth-password" placeholder="비밀번호 입력">
        <div style="text-align: center; margin-top: 15px;">
            <button id="btn-login">로그인</button>
            <button id="btn-signup" class="btn-secondary">이메일 회원가입</button>
        </div>
    </div>

    <div id="app-box" class="app-box">
        <div class="header-bar">
            <span id="user-info" style="font-weight: bold;">사용자님 환영합니다!</span>
            <button id="btn-logout" class="btn-secondary" style="padding: 8px 15px;">로그아웃</button>
        </div>
        
        <h1>💡 AI 개념 탐험가</h1>
        
        <div class="main-content">
            <div class="search-section">
                <h3>궁금한 개념을 입력하세요</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="search-input" placeholder="예: 양자역학, 인공지능, 조선의 건국">
                    <button id="btn-search" style="flex-shrink: 0;">탐험 시작</button>
                </div>
                
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button id="btn-tts" class="btn-secondary" style="display:none;">🔊 소리로 듣기 (TTS)</button>
                    <button id="btn-save" style="background-color: #28a745; display:none;">💾 내 노트에 저장</button>
                </div>
                
                <div id="result-text" class="result-area">궁금한 키워드를 입력하고 버튼을 누르면 AI의 명쾌한 설명이 나옵니다.</div>
            </div>

            <div class="history-section">
                <h3>📚 나의 학습 노트</h3>
                <ul id="history-list" class="history-list">
                    </ul>
            </div>
        </div>
    </div>
</div>

<script type="module">
    // Firebase v10 라이브러리 로드 (CDN)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚠️ [필수 고치기 1] 본인의 Firebase 프로젝트 설정값을 입력하세요.
     const firebaseConfig = {
      apiKey: "AIzaSyCijfeiY87b_xMZjWrLkeQM2-Pb7DoTAdI",
      authDomain: "hisangegaepaegi.firebaseapp.com",
      databaseURL: "https://hisangegaepaegi-default-rtdb.firebaseio.com",
      projectId: "hisangegaepaegi",
      storageBucket: "hisangegaepaegi.firebasestorage.app",
      messagingSenderId: "722816404715",
      appId: "1:722816404715:web:7cc165f19ff4ed2b5302ae",
      measurementId: "G-6ZMJKKP9T1"
    };

    // ⚠️ [필수 고치기 2] 본인의 Google Gemini API Key를 입력하세요.
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 전역 상태 변수
    let currentUser = null;
    let currentExplanation = "";

    // DOM 요소 선택
    const authBox = document.getElementById('auth-box');
    const appBox = document.getElementById('app-box');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const resultText = document.getElementById('result-text');
    const btnTts = document.getElementById('btn-tts');
    const btnSave = document.getElementById('btn-save');
    const historyList = document.getElementById('history-list');

    /* ====================================================================
       1. Firebase Authentication (이메일/비밀번호 로그인 관리)
       ==================================================================== */
    
    // 회원가입
    document.getElementById('btn-signup').addEventListener('click', () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        if(!email || !password) return alert('이메일과 비밀번호를 입력해주세요.');
        
        createUserWithEmailAndPassword(auth, email, password)
            .then(() => alert('회원가입 성공! 자동 로그인되었습니다.'))
            .catch(err => alert('회원가입 실패: ' + err.message));
    });

    // 로그인
    document.getElementById('btn-login').addEventListener('click', () => {
        const email = emailInput.value;
        const password = passwordInput.value;
        if(!email || !password) return alert('이메일과 비밀번호를 입력해주세요.');

        signInWithEmailAndPassword(auth, email, password)
            .then(() => alert('로그인 성공!'))
            .catch(err => alert('로그인 실패: ' + err.message));
    });

    // 로그아웃
    document.getElementById('btn-logout').addEventListener('click', () => {
        signOut(auth).then(() => alert('로그아웃 되었습니다.'));
    });

    // 인증 상태 실시간 감지
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('user-info').innerText = `${user.email} 님`;
            authBox.classList.remove('active');
            appBox.classList.add('active');
            loadHistory(); // 로그인 성공 시 저장 기록 불러오기
        } else {
            currentUser = null;
            authBox.classList.add('active');
            appBox.classList.remove('active');
            historyList.innerHTML = '';
        }
    });

    /* ====================================================================
       2. Generative AI 연동 (Google Gemini API)
       ==================================================================== */
    document.getElementById('btn-search').addEventListener('click', async () => {
        const keyword = document.getElementById('search-input').value;
        if(!keyword) return alert('검색할 개념을 입력하세요.');

        resultText.innerText = "🤖 AI가 개념을 열심히 탐험하여 정리하고 있습니다...";
        btnTts.style.display = 'none';
        btnSave.style.display = 'none';

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: `'${keyword}'에 대해 중고등학생이 이해하기 쉽게 비유를 들어 친절하게 설명해주고, 마지막에 핵심 요약 3줄을 작성해줘.` }]
                    }]
                })
            });

            const data = await response.json();
            currentExplanation = data.candidates[0].content.parts[0].text;
            
            resultText.innerText = currentExplanation;
            btnTts.style.display = 'inline-block';
            btnSave.style.display = 'inline-block';
        } catch (error) {
            resultText.innerText = "에러가 발생했습니다. API 키나 네트워크를 확인해주세요.";
            console.error(error);
        }
    });

    /* ====================================================================
       3. TTS 기능 활용 (Web Speech API)
       ==================================================================== */
    btnTts.addEventListener('click', () => {
        if (!currentExplanation) return;
        
        // 마크다운 문자가 있으면 읽기 어색하므로 특수기호 제거
        const cleanText = currentExplanation.replace(/[*#`_\-]/g, '');
        
        // 브라우저가 읽고 있는 소리가 있다면 멈추기
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'ko-KR'; // 한국어 설정
        utterance.rate = 1.0;     // 속도 설정
        window.speechSynthesis.speak(utterance);
    });

    /* ====================================================================
       4. Firebase Firestore 연동 (데이터 저장 및 실시간 연동)
       ==================================================================== */
    
    // 데이터 저장
    btnSave.addEventListener('click', async () => {
        const keyword = document.getElementById('search-input').value;
        if (!currentUser || !currentExplanation || !keyword) return;

        try {
            await addDoc(collection(db, "study_notes"), {
                uid: currentUser.uid,
                keyword: keyword,
                explanation: currentExplanation,
                timestamp: new Date()
            });
            alert('나의 학습 노트에 성공적으로 저장되었습니다!');
        } catch (error) {
            alert('저장 실패: ' + error.message);
        }
    });

    // 사용자의 데이터 실시간으로 불러와서 리스트에 표시하기
    function loadHistory() {
        if (!currentUser) return;

        const q = query(
            collection(db, "study_notes"), 
            where("uid", "==", currentUser.uid)
        );

        // 실시간 리스너 연동 (onSnapshot)
        onSnapshot(q, (querySnapshot) => {
            historyList.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.innerText = `📘 ${data.keyword}`;
                // 리스트 아이템 클릭 시 과거 저장된 내용 보여주기 및 TTS 세팅
                li.addEventListener('click', () => {
                    document.getElementById('search-input').value = data.keyword;
                    resultText.innerText = data.explanation;
                    currentExplanation = data.explanation;
                    btnTts.style.display = 'inline-block';
                    btnSave.style.display = 'inline-block';
                });
                historyList.appendChild(li);
            });
        });
    }
</script>
</body>
</html>
